services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/insightflow.db
    volumes:
      - insightflow-data:/data
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
volumes:
  insightflow-data:
